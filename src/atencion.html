<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atención de reporte - Alumbrado Público</title>
  <link rel="stylesheet" href="styles.css">
  <script src="entrada-dia.js"></script>
  <script src="qrcode.min.js"></script>
  <script src="search-guard.js" defer></script>
  <script type="module" src="atencion.js" defer></script>
  <script type="module" src="admin-mode.js"></script>
</head>

<body>

  <div id="toastNotification" class="toast-notification hidden" role="alert">
    <div class="toast-icon" id="toastIcon"></div>
    <span class="toast-message" id="toastMessage"></span>
    <button type="button" class="toast-close" id="toastClose" aria-label="Cerrar">&times;</button>
  </div>

  <div class="app-shell">

    <div id="appSidebarMount"></div>
    <script src="sidebar.js"></script>

    <div class="app-main-content">
      <main class="app-container">
        <header class="app-top-nav">
          <div class="nav-title-group">
            <h1 class="app-title" id="pageTitle">Nueva atención</h1>
            <p class="app-desc">La atención queda vinculada al folio del reporte.</p>
          </div>
          <div class="nav-actions">
            <a href="registros-reportes.html" class="btn btn-secondary btn-nav-link" id="btnVolver">Volver a reportes</a>
          </div>
        </header>

        <form class="panel form-report" id="form" autocomplete="off">
          <div class="panel-header">
            <h2 class="panel-title" id="formTitle">Datos de la atención</h2>
          </div>

          <div class="form-grid">
            <label class="field col-2">
              <span class="field-label">Folio <span class="required">*</span></span>
              <input type="text" id="folio" required data-keep-case="true" class="field-input" readonly>
            </label>
            <label class="field col-1">
              <span class="field-label">Fecha de atención</span>
              <input type="date" id="fecha" class="field-input">
            </label>
            <label class="field col-1">
              <span class="field-label">Hora de atención</span>
              <input type="time" id="hora" class="field-input">
            </label>

            <div class="field col-2">
              <span class="field-label">Personal que atendió</span>
              <div class="multiselect-container" id="atendioContainer">
                <div class="multiselect-box" id="atendioChipsBox">
                  <input type="text" id="atendioSearchInput" class="multiselect-input" placeholder="Buscar personal..."
                    autocomplete="off">
                </div>
                <div class="multiselect-dropdown hidden" id="atendioDropdown" role="listbox"></div>
              </div>
              <input type="hidden" id="atendio" value="">
            </div>

            <label class="field col-4">
              <span class="field-label">Descripción</span>
              <textarea id="descripcion" rows="3" placeholder="Describe la atención realizada..."
                class="field-textarea"></textarea>
            </label>

            <div class="geo-panel col-4">
              <div class="geo-panel-header">
                <h3 class="geo-panel-title">Geolocalización</h3>
                <span class="geo-panel-hint">Pega un enlace de Google Maps o escribe las coordenadas</span>
              </div>
              <label class="field col-4 geo-input-wrapper">
                <span class="field-label">Enlace de Google Maps o coordenadas</span>
                <div class="geo-input-group">
                  <input type="text" id="geoLink" placeholder="Ej. https://maps.app.goo.gl/... o 20.391900, -101.191200"
                    class="field-input">
                  <button type="button" id="btnObtenerGeo" class="btn btn-navy">Obtener</button>
                </div>
                <span class="geo-hint-badge" id="geoMsg">Pega el enlace y presiona «Obtener» para extraer latitud y longitud.</span>
              </label>
              <div class="geo-subgrid">
                <label class="field">
                  <span class="field-label">Latitud</span>
                  <input type="text" id="lat" placeholder="Ej. 20.391900" class="field-input">
                </label>
                <label class="field">
                  <span class="field-label">Longitud</span>
                  <input type="text" id="lon" placeholder="Ej. -101.191200" class="field-input">
                </label>
                <label class="field">
                  <span class="field-label">Altitud (opcional)</span>
                  <input type="text" id="alt" placeholder="Ej. 1,720 msnm" class="field-input">
                </label>
              </div>
              <div id="formQrPreview" class="form-qr-preview hidden">
                <div id="formQrImg" class="form-qr-img"></div>
                <div class="form-qr-info">
                  <strong class="form-qr-status">Código QR generado correctamente.</strong>
                  <div class="form-qr-url-row">
                    <span>Destino: </span>
                    <span id="formQrUrlPreview" class="form-qr-url"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="form-photo-section">
            <label class="field">
              <span class="field-label">Fotografías de la atención (Foto 1 y Foto 2)</span>
              <span class="field-sublabel">Haz clic, arrastra o pega con Ctrl+V. Se guardan en la carpeta del folio, dentro de esta atención.</span>
            </label>
            <div class="drops-container" id="drops"></div>
          </div>

          <div class="form-actions-bar">
            <button type="submit" class="btn btn-primary" id="btnSave">Guardar atención</button>
            <button type="button" class="btn btn-secondary" id="btnCancel">Cancelar</button>
            <button type="button" class="btn admin-delete-btn hidden" id="btnAdminDelete">Eliminar completamente</button>
          </div>
        </form>
      </main>
    </div>
  </div>

</body>

</html>
