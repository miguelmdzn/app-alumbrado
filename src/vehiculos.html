<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de vehículos - Alumbrado Público</title>
  <link rel="stylesheet" href="styles.css">
  <script src="entrada-dia.js"></script>
  <script src="search-guard.js" defer></script>
  <script type="module" src="admin-mode.js"></script>
</head>

<body>

  <div id="toastNotification" class="toast-notification hidden" role="alert">
    <div class="toast-icon" id="toastIcon"></div>
    <span class="toast-message" id="toastMessage"></span>
    <button type="button" class="toast-close" id="toastClose" aria-label="Cerrar">&times;</button>
  </div>

  <div class="app-shell">
    <div id="appSidebarMount"></div>
    <script src="sidebar.js"></script>

    <div class="app-main-content">
      <main class="app-container">
        
        <header class="app-top-nav">
          <div class="nav-title-group">
            <h1 class="app-title">Catálogo de vehículos</h1>
            <p class="app-desc">Alta, consulta, edición y desactivación de las unidades del control de combustibles.</p>
          </div>
          <a class="learn-more" href="control-combustibles.html">
            <span class="circle" aria-hidden="true"><span class="icon arrow"></span></span>
            <span class="button-text">Regresar</span>
          </a>
        </header>

        <section class="records-container-card hidden" id="panelVehiculo">
          <h2 class="form-section-title" id="tituloFormVehiculo">Nuevo vehículo</h2>
          <form id="formVehiculo" class="form-grid" autocomplete="off">
            <div class="field col-2">
              <label class="field-label" for="numeroSerie">Número de serie</label>
              <input class="field-input" id="numeroSerie" type="text" autocomplete="off" required>
            </div>
            <div class="field col-2">
              <label class="field-label" for="placas">Placas</label>
              <input class="field-input" id="placas" type="text" autocomplete="off">
            </div>
            <div class="field col-2">
              <label class="field-label" for="marca">Marca</label>
              <input class="field-input" id="marca" type="text" autocomplete="off">
            </div>
            <div class="field col-2">
              <label class="field-label" for="modelo">Modelo</label>
              <input class="field-input" id="modelo" type="text" autocomplete="off">
            </div>
            <div class="field col-1">
              <label class="field-label" for="anio">Año</label>
              <input class="field-input" id="anio" type="number" min="1950" max="2100" autocomplete="off">
            </div>
            <div class="field col-1">
              <label class="field-label" for="numResguardo">Núm. de resguardo</label>
              <input class="field-input" id="numResguardo" type="text" autocomplete="off">
            </div>
            <div class="field col-2">
              <label class="field-label" for="estado">Estado</label>
              <select class="field-input" id="estado">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>
            <div class="field col-2">
              <label class="field-label" for="responsableBien">Responsable del bien</label>
              <input class="field-input" id="responsableBien" type="text" autocomplete="off">
            </div>
            <div class="field col-2">
              <label class="field-label" for="descripcion">Descripción</label>
              <input class="field-input" id="descripcion" type="text" autocomplete="off">
            </div>
            <div class="col-4 form-actions-bar">
              <button type="submit" class="btn btn-primary">Guardar</button>
              <button type="button" class="btn btn-secondary" id="btnCancelarVehiculo">Cancelar</button>
              <button type="button" class="btn btn-danger-outline hidden" id="btnDesactivarVehiculo">Desactivar</button>
              <button type="button" class="btn admin-delete-btn hidden" id="btnAdminDelete">Eliminar completamente</button>
            </div>
          </form>
        </section>

        <section class="records-container-card">
          <div class="records-toolbar">
            <div class="records-toolbar-left">
              <div class="records-search-wrapper">
                <input id="buscarVehiculo" class="field-input" type="text" placeholder="Buscar por placa, serie o responsable" autocomplete="off" spellcheck="false">
              </div>
              <select id="filtroEstado" class="field-input">
                <option value="Activo">Activos</option>
                <option value="Inactivo">Inactivos</option>
                <option value="">Todos</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary" id="btnNuevoVehiculo">Nuevo vehículo</button>
          </div>
          <p class="combustible-note"><span id="lblTotalVehiculos">0</span> vehículos en la consulta.</p>
          <div class="table-responsive">
            <table class="records-table">
              <thead>
                <tr>
                  <th>Placas</th>
                  <th>Núm. de serie</th>
                  <th>Marca</th>
                  <th>Modelo</th>
                  <th>Resguardo</th>
                  <th>Responsable</th>
                  <th>Estado</th>
                  <th class="td-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaVehiculos"></tbody>
            </table>
          </div>
          <div class="table-pagination" id="tablePagination"></div>
        </section>

      </main>
    </div>
  </div>
  <div id="modalDetalleVehiculo" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card" style="max-width: 520px;">
      <h2 class="modal-title">Detalle del vehículo</h2>
      <div id="detalleVehiculoCuerpo"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btnCerrarDetalleVehiculo">Cerrar</button>
        <button type="button" class="btn btn-primary" id="btnEditarDesdeDetalle">Editar</button>
      </div>
    </div>
  </div>
  <script type="module" src="vehiculos.js"></script>
</body>

</html>
