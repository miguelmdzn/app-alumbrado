<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunidades y Colonias - Alumbrado Público</title>
  <link rel="stylesheet" href="styles.css">
  <script src="entrada-dia.js"></script>
  <script src="search-guard.js" defer></script>
  <script type="module" src="comunidades-colonias.js" defer></script>
  <script type="module" src="admin-mode.js"></script>
</head>

<body>
  <!-- Notificación Toast flotante -->
  <div id="toastNotification" class="toast-notification hidden" role="alert">
    <div class="toast-icon" id="toastIcon"></div>
    <span class="toast-message" id="toastMessage"></span>
    <button type="button" class="toast-close" id="toastClose" aria-label="Cerrar">&times;</button>
  </div>

  <div class="app-shell">
    <div id="appSidebarMount"></div>
    <script src="sidebar.js"></script>

    <div class="app-main-content">
      <main class="app-container">

        <!-- Encabezado -->
        <header class="app-top-nav">
          <div class="nav-title-group">
            <h1 class="app-title">Comunidades y Colonias</h1>
            <p class="app-desc">Catálogo de localidades del municipio (colonias y comunidades / rancherías).</p>
          </div>
          <div class="nav-actions">
            <button type="button" class="btn btn-primary btn-nav-link" id="btnNuevaLocalidad">
              <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Agregar localidad
            </button>
          </div>
        </header>

        <!-- Tabla de localidades -->
        <section class="records-container-card">
          <div class="records-toolbar">
            <div class="records-toolbar-left">
              <div class="records-search-wrapper">
                <input type="text" id="searchLocalidades" name="filtro-localidades" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                  placeholder="Buscar por nombre o tipo..." class="field-input" role="searchbox">
              </div>
              <select id="filterTipo" class="field-select records-status-select" aria-label="Filtrar por tipo">
                <option value="">TODOS LOS TIPOS</option>
                <option value="Cabecera municipal">CABECERA MUNICIPAL</option>
                <option value="Comunidad">COMUNIDAD</option>
              </select>
            </div>
            <div class="records-stats-summary">
              <div class="stat-pill">Total: <strong id="lblTotal">0</strong></div>
            </div>
          </div>

          <div class="table-responsive">
            <table class="records-table">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Tipo</th>
                  <th class="td-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="localidadesTableBody">
              </tbody>
            </table>
          </div>
          <div class="table-pagination" id="tablePagination"></div>
        </section>

      </main>
    </div>
  </div>

  <!-- Modal: Crear / Editar localidad -->
  <div id="modalLocalidad" class="modal-overlay hidden" role="dialog" aria-modal="true"
    aria-labelledby="modalLocalidadTitle">
    <div class="modal-card">
      <div class="modal-header-row">
        <h2 class="modal-title" id="modalLocalidadTitle">Nueva Localidad</h2>
        <button type="button" class="btn-close-modal" id="btnCerrarModalLocalidadX" aria-label="Cerrar">&times;</button>
      </div>

      <form id="formLocalidad" autocomplete="off">
        <div class="form-grid" style="gap:16px; margin-bottom:20px;">
          <label class="field col-4">
            <span class="field-label">Nombre <span class="required">*</span></span>
            <input type="text" id="inputNombreLocalidad" class="field-input"
              placeholder="Ej. COL. BELLAVISTA" required>
          </label>
          <label class="field col-4">
            <span class="field-label">Tipo <span class="required">*</span></span>
            <select id="selectTipoLocalidad" class="field-select" required>
              <option value="Cabecera municipal">CABECERA MUNICIPAL (VALLE DE SANTIAGO)</option>
              <option value="Comunidad">COMUNIDAD / RANCHO</option>
            </select>
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btnCancelarLocalidad">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnGuardarLocalidad">Guardar</button>
          <button type="button" class="btn admin-delete-btn hidden" id="btnAdminDelete">Eliminar completamente</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Ver detalle -->
  <div id="modalDetalleLocalidad" class="modal-overlay hidden" role="dialog" aria-modal="true"
    aria-labelledby="modalDetalleTitleLoc">
    <div class="modal-card">
      <div class="modal-header-row">
        <h2 class="modal-title" id="modalDetalleTitleLoc">Detalle de Localidad</h2>
        <button type="button" class="btn-close-modal" id="btnCerrarDetalleLocX" aria-label="Cerrar">&times;</button>
      </div>
      <div class="detail-grid" id="modalDetalleLocContent"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btnCerrarDetalleLoc">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Confirmar eliminación -->
  <div id="modalEliminarLocalidad" class="modal-overlay hidden" role="dialog" aria-modal="true"
    aria-labelledby="modalEliminarTitleLoc">
    <div class="modal-card">
      <h2 class="modal-title" id="modalEliminarTitleLoc">Eliminar localidad</h2>
      <p class="modal-text">¿Estás seguro de que deseas eliminar esta localidad? Esta acción no se puede deshacer.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btnCancelarEliminarLoc">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnConfirmarEliminarLoc">Eliminar</button>
      </div>
    </div>
  </div>

</body>

</html>
