<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de lámpara - Alumbrado Público</title>
  <link rel="stylesheet" href="styles.css">
  <script src="entrada-dia.js"></script>
  <script src="search-guard.js" defer></script>
  <script type="module" src="solicitudes-lamparas.js" defer></script>
  <script type="module" src="admin-mode.js"></script>
</head>

<body>

  <div id="toastNotification" class="toast-notification hidden" role="alert">
    <div class="toast-icon" id="toastIcon"></div>
    <span class="toast-message" id="toastMessage"></span>
    <button type="button" class="toast-close" id="toastClose" aria-label="Cerrar">&times;</button>
  </div>

  <div class="app-shell">

    <div id="appSidebarMount"></div>
    <script src="sidebar.js"></script>

    <div class="app-main-content">
      <main class="app-container">

        <header class="app-top-nav">
          <div class="nav-title-group">
            <h1 class="app-title" id="pageTitle">Solicitud de instalación de lámpara</h1>
            <p class="app-desc">Registro de solicitudes de instalación. El tipo de localidad es el mismo que en los reportes de falla.</p>
          </div>
          <div class="nav-actions">
            <a href="registros-reportes.html" class="btn btn-secondary btn-nav-link">Ver reportes</a>
          </div>
        </header>

        <form class="panel form-report" id="solicitudForm" autocomplete="off">
          <div class="panel-header">
            <h2 class="panel-title" id="solicitudFormTitle">Nueva solicitud de lámpara</h2>
          </div>

          <div class="form-grid">
            <label class="field col-2">
              <span class="field-label">Nombre del solicitante <span class="required">*</span></span>
              <input type="text" id="nombreSolicitante" required placeholder="Ej. María López Hernández" class="field-input">
            </label>

            <label class="field col-1">
              <span class="field-label">Teléfono</span>
              <input type="tel" id="telefono" placeholder="Ej. 461-123-4567" class="field-input" maxlength="20">
            </label>

            <label class="field col-1">
              <span class="field-label">Fecha de solicitud</span>
              <input type="date" id="fechaSolicitud" class="field-input">
            </label>

            <label class="field col-1">
              <span class="field-label">Tipo de localidad</span>
              <select id="tipoLocalidad" class="field-select">
                <option value="Cabecera municipal (Valle de Santiago)">CABECERA MUNICIPAL (VALLE DE SANTIAGO)</option>
                <option value="Comunidad">COMUNIDAD</option>
              </select>
            </label>

            <!-- Colonia / comunidad con autocomplete idéntico a reportes -->
            <label class="field col-1">
              <span class="field-label">Colonia o comunidad</span>
              <div class="autocomplete-wrapper">
                <input type="text" id="colonia" placeholder="Ej. Col. Bellavista" class="field-input"
                  autocomplete="off" aria-autocomplete="list" aria-controls="listColoniaComunidad">
                <ul id="listColoniaComunidad" class="autocomplete-list" role="listbox" style="display:none;">
                </ul>
              </div>
            </label>

            <label class="field col-1">
              <span class="field-label">Cantidad de lámparas</span>
              <input type="number" id="cantidadLamparas" min="1" value="1" class="field-input">
            </label>

            <label class="field col-1" id="fieldEstatus">
              <span class="field-label">Estatus</span>
              <select id="estatus" class="field-select">
                <option value="En espera" selected>EN ESPERA</option>
                <option value="Pendiente">PENDIENTE</option>
                <option value="Urgente">URGENTE</option>
                <option value="Atendido">ATENDIDO</option>
                <option value="Otro">OTRO</option>
              </select>
            </label>

            <label class="field col-2 hidden" id="wrapOtroEstatus">
              <span class="field-label">Especificar estatus <span class="required">*</span></span>
              <input type="text" id="otroEstatus" placeholder="Ej. En revisión" class="field-input">
            </label>

            <label class="field col-4">
              <span class="field-label">Descripción</span>
              <textarea id="descripcion" rows="3" placeholder="Dónde se solicita la instalación y qué se necesita..." class="field-textarea"></textarea>
            </label>

            <label class="field col-4">
              <span class="field-label">Observaciones</span>
              <textarea id="observaciones" rows="3" placeholder="Notas de seguimiento..." class="field-textarea"></textarea>
            </label>
          </div>

          <div class="form-actions-bar">
            <button type="submit" class="btn btn-primary" id="btnSaveSolicitud">Guardar solicitud</button>
            <button type="button" class="btn btn-secondary" id="btnResetSolicitud">Limpiar campos</button>
            <a href="registros-reportes.html" class="btn btn-secondary">Ver reportes / solicitudes</a>
            <button type="button" class="btn admin-delete-btn hidden" id="btnAdminDelete">Eliminar completamente</button>
          </div>
        </form>

      </main>
    </div>
  </div>

</body>

</html>
