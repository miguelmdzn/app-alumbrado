<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atenciones del reporte - Alumbrado Público</title>
  <link rel="stylesheet" href="styles.css">
  <script src="entrada-dia.js"></script>
  <script type="module" src="atenciones.js" defer></script>
  <script type="module" src="admin-mode.js"></script>
</head>

<body>
  <div class="app-shell">

    <div id="appSidebarMount"></div>
    <script src="sidebar.js"></script>

    <div class="app-main-content">
      <main class="app-container app-container-fluid">
        <header class="app-top-nav">
          <div class="nav-title-group">
            <h1 class="app-title">Atenciones del reporte</h1>
            <p class="app-desc" id="pageDesc">Consulta, detalle y edición de las atenciones vinculadas al folio.</p>
          </div>
          <div class="nav-actions">
            <a href="registros-reportes.html" class="btn btn-secondary btn-nav-link">Volver a reportes</a>
            <a href="atencion.html" class="btn btn-primary btn-nav-link" id="btnNuevaAtencion">Agregar atención</a>
          </div>
        </header>

        <section class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Información del reporte</h2>
          </div>
          <div class="detail-grid" id="reporteInfo"></div>
        </section>

        <section class="records-container-card">
          <div class="records-toolbar">
            <div class="records-stats-summary">
              <div class="stat-pill">Atenciones: <strong id="lblTotal">0</strong></div>
            </div>
          </div>
          <div class="table-responsive">
            <table class="records-table">
              <thead>
                <tr>
                  <th>No.</th>
                  <th>Fecha</th>
                  <th>Hora</th>
                  <th>Personal que atendió</th>
                  <th>Descripción</th>
                  <th class="td-center">Fotos</th>
                  <th class="td-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="atencionesBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="modalDetalleAtencion" class="modal-overlay hidden" role="dialog" aria-modal="true"
    aria-labelledby="modalDetalleAtencionTitle">
    <div class="modal-card modal-card-detail">
      <div class="modal-header-row">
        <h2 class="modal-title" id="modalDetalleAtencionTitle">Detalle de la atención</h2>
        <button type="button" class="btn-close-modal" id="btnCerrarDetalleAtencionX" aria-label="Cerrar">&times;</button>
      </div>
      <div class="detail-grid" id="modalDetalleAtencionContent"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="btnEditarAtencionDetalle">Editar</button>
        <button type="button" class="btn btn-secondary" id="btnCerrarDetalleAtencion">Cerrar</button>
      </div>
    </div>
  </div>

</body>

</html>
